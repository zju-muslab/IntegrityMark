defaults:
  - dataset
  - augmentation


ckpt_name: '0+4'
ckpt_path: False

augmentation:
  audio_effects:
    pink_noise:
      noise_std: 0.0001
    mp3_compression:
      sample_rate: ${sample_rate}
      bitrate: 64k
    aac_compression:
      sample_rate: ${sample_rate}
      bitrate: 64k
    opus_compression:
      sample_rate: ${sample_rate}
      bitrate: 64k

aug_weights:
  speed: 0
  updownresample: 0
  echo: 0
  quantize_audio: 0
  pink_noise: 0
  lowpass_filter: 0
  highpass_filter: 0
  bandpass_filter: 0
  smooth: 0
  boost_audio: 0
  duck_audio: 0
  mp3_compression: 0
  aac_compression: 0
  opus_compression: 0
  encodec: 0
  identity: 0
