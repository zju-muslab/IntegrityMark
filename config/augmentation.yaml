sample_rate: 16000

augmentation:
  audio_effects:
    speed:
      sample_rate: ${sample_rate}
      speed_range: [0.8, 1.2]
    updownresample:
      sample_rate: ${sample_rate}
      intermediate_freq: 8000
    echo:
      sample_rate: ${sample_rate}
      volume_range: [0.1, 0.5]
      duration_range: [0.1, 0.5]
    random_noise:
      noise_std: 0.001
    pink_noise:
      noise_std: 0.01
    lowpass_filter:
      sample_rate: ${sample_rate}
      cutoff_freq: 5000
    highpass_filter:
      cutoff_freq: 500
      sample_rate: ${sample_rate}
    bandpass_filter:
      cutoff_freq_low: 300
      cutoff_freq_high: 8000
      sample_rate: ${sample_rate}
    smooth:
      window_size_range: [2, 10]
    boost_audio:
      amount: 20
    duck_audio:
      amount: 20
    mp3_compression:
      sample_rate: ${sample_rate}
      bitrate: 128k
    aac_compression:
      sample_rate: ${sample_rate}
      bitrate: 128k
      lowpass_freq: null

  select_aug_mode: "weighted"




  aug_weights:
    speed: 0
    updownresample: 0.2
    echo: 0
    quantize_audio: 0.2
    pink_noise: 0.2
    random_noise: 0.2
    lowpass_filter: 0.2
    highpass_filter: 0.2
    bandpass_filter: 0.2
    smooth: 0.2
    boost_audio: 0.2
    duck_audio: 0.2
    mp3_compression: 0
    aac_compression: 0
    encodec: 0
    identity: 0

  n_max_aug: 3
